<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a08">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="فروشگاه شهر فرنگم">
<title>فروشگاه شهر فرنگم</title>
<style>
:root{--wm:none;--bg:#0b0a08;--bg2:#121009;--card:#17140e;--line:#2a251a;--gold:#d4af37;--gold2:#f3d97f;--txt:#f5eedb;--mut:#a39a82;--wa:#25d366;--g:linear-gradient(135deg,#f3d97f,#c9a227 55%,#9c7a12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(120% 55% at 50% -8%,rgba(212,175,55,.13),transparent 60%),var(--bg);color:var(--txt);font-family:Vazirmatn,"IRANSans",Tahoma,"Segoe UI",sans-serif;line-height:1.7;padding-bottom:116px;overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
#wm{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--wm) center 46%/min(92vw,560px) no-repeat}
main{position:relative;z-index:1}

/* splash */
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}

/* logo */
.lg{background:var(--g);color:#1a1405;display:flex;align-items:center;justify-content:center;font-weight:800;overflow:hidden;box-shadow:0 8px 30px rgba(212,175,55,.25)}
.lg img{width:100%;height:100%;object-fit:cover}
.lg span{font-size:1.9em}

/* header */
header{position:sticky;top:0;z-index:30;background:rgba(11,10,8,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.top .lg{width:40px;height:40px;border-radius:12px;font-size:16px}
.top b{font-size:19px;display:block;line-height:1.2}
.top small{color:var(--mut);font-size:11px}
.sb{position:relative;margin-top:10px}
.sb input{width:100%;padding:11px 42px 11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);outline:0}
.sb input:focus{border-color:var(--gold)}
.sb::before{content:"🔍";position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.7}

/* hero */
.hero{box-shadow:0 12px 40px rgba(212,175,55,.09);margin:14px 16px 4px;border-radius:22px;padding:20px;background:linear-gradient(135deg,#2a2108,#14100a 60%);border:1px solid #3a2f12;position:relative;overflow:hidden}
.hero::after{content:"💎";position:absolute;left:-6px;bottom:-14px;font-size:96px;opacity:.14;transform:rotate(-14deg)}
.hero h2{margin:0 0 4px;font-size:19px;color:var(--gold2)}
.hero p{margin:0 0 14px;color:#cfc6ad;font-size:13px;max-width:72%}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none;font-size:14px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.wa{background:var(--wa);color:#05230f}
.btn.gold{background:var(--g);color:#1a1405}
.btn.ghost{background:var(--card);border:1px solid var(--line)}
.btn.red{background:#431616;color:#ffb4b4}

/* categories */
.sec{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 8px}
.sec h3{margin:0;font-size:16px}
.cats{display:flex;gap:14px;overflow-x:auto;padding:0 16px 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.ct{flex:none;width:68px;text-align:center;cursor:pointer;font-size:12px;color:var(--mut)}
.ct i{display:block;width:62px;height:62px;border-radius:50%;margin:0 auto 4px;background:var(--card) center/cover;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:24px}
.ct.on i{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.2)}
.ct.on{color:var(--gold2);font-weight:700}

/* grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px}
@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}}
.pc{background:rgba(23,20,14,.74);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(212,175,55,.16);border-radius:18px;overflow:hidden;cursor:pointer;animation:up .45s both;transition:transform .2s,border-color .2s}
.pc:active{transform:scale(.98)}
.pc .im{aspect-ratio:1;background:#000 center/cover no-repeat;position:relative}
.pc .vb{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.65);border-radius:10px;padding:0 8px;font-size:11px}
.pc .hv{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.55);font-size:16px;cursor:pointer;backdrop-filter:blur(4px)}
.pc .tx{padding:10px 12px 12px}
.pc h4{margin:0;font-size:13.5px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pc .cl{color:var(--mut);font-size:11px}
.price{color:var(--gold2);font-weight:700;font-size:14px;margin-top:2px}
.empty{text-align:center;color:var(--mut);padding:50px 20px;grid-column:1/-1}

/* bottom nav */
nav{position:fixed;bottom:0;left:12px;right:12px;z-index:35;display:flex;justify-content:center;padding-bottom:calc(10px + env(safe-area-inset-bottom));pointer-events:none}
nav .in{display:flex;width:100%;max-width:560px;align-items:center;justify-content:space-around;height:64px;pointer-events:auto;border-radius:30px;background:rgba(20,17,11,.76);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(212,175,55,.22);box-shadow:0 12px 34px rgba(0,0,0,.55)}
nav .it{flex:1;text-align:center;font-size:11px;color:var(--mut);cursor:pointer;border:0;background:none}
nav .it span{display:block;font-size:21px;line-height:1.2}
nav .it.on{color:var(--gold2)}
nav .mid{flex:none;width:62px;height:62px;margin-top:-26px;border-radius:50%;background:var(--wa);color:#05230f;display:flex;align-items:center;justify-content:center;font-size:28px;text-decoration:none;box-shadow:0 8px 24px rgba(37,211,102,.4);border:4px solid var(--bg)}

/* sheets */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--wm) center 42%/80% no-repeat,var(--bg);width:100%;max-width:640px;height:96vh;overflow:auto;border-radius:24px 24px 0 0;border:1px solid var(--line);position:relative;animation:slide .3s ease both}
@keyframes slide{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.x{position:absolute;top:12px;left:12px;z-index:5;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.6);font-size:18px;cursor:pointer;backdrop-filter:blur(6px)}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:#000}
.gal::-webkit-scrollbar{display:none}
.gal>*{flex:none;width:100%;aspect-ratio:1;object-fit:contain;scroll-snap-align:center;background:#000}
.dots{display:flex;justify-content:center;gap:6px;margin:10px 0 0}
.dots i{width:7px;height:7px;border-radius:50%;background:#3a3426}
.dots i.on{background:var(--gold);width:20px;border-radius:5px}
.bd{padding:6px 18px 20px}
.bd h2{margin:8px 0 2px;font-size:21px}
.bd .price{font-size:21px}
.card{background:rgba(23,20,14,.74);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(212,175,55,.16);border-radius:16px;padding:4px 14px;margin:14px 0}
.card h5{margin:12px 0 4px;font-size:14px;color:var(--gold2)}
table{width:100%;border-collapse:collapse}
td{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
tr:last-child td{border:0}
td:first-child{color:var(--mut);width:38%}
.desc{white-space:pre-wrap;color:#ddd5bf;font-size:14px;padding-bottom:10px}
.bar{position:sticky;bottom:0;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.bar .btn{flex:1;padding:14px}

/* admin */
.adm{padding:18px}
.adm h2{margin:0 0 6px}
label{display:block;margin:12px 0 4px;color:var(--mut);font-size:13px}
.inp{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:0}
.inp:focus{border-color:var(--gold)}
textarea.inp{min-height:90px}
.sp{display:flex;gap:6px;margin-bottom:6px}
.mg{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.mi{width:72px;height:72px;border-radius:12px;background:#000 center/cover;position:relative}
.mi button{position:absolute;top:-6px;left:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#c33;color:#fff;cursor:pointer}
.mi b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0006;border-radius:12px}
.al{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.al .t{width:46px;height:46px;border-radius:10px;background:#000 center/cover;flex:none}
.al span{flex:1;font-size:14px}
.tabs{display:flex;gap:8px;margin:10px 0 14px}
.tabs div{flex:1;text-align:center;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:14px}
.tabs div.on{background:var(--g);color:#1a1405;font-weight:700;border-color:transparent}
.row{display:flex;gap:10px;margin-top:14px}
.row .btn{flex:1}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--g);color:#1a1405;padding:9px 20px;border-radius:14px;z-index:120;font-weight:700;display:none;box-shadow:0 8px 24px #0008}

/* polish */
.sec h3{position:relative;padding-right:12px}
.sec h3::before{content:"";position:absolute;right:0;top:18%;bottom:18%;width:4px;border-radius:3px;background:var(--g)}
.pc .im::after{content:"";position:absolute;inset:auto 0 0 0;height:42%;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.pc .vb,.pc .hv{z-index:1}
.btn.wa{background:linear-gradient(135deg,#2be072,#1fb958)}
nav .it{transition:color .2s}
nav .it.on span{filter:drop-shadow(0 0 8px rgba(212,175,55,.65))}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 16px 0}
.qa button{background:rgba(23,20,14,.74);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(212,175,55,.16);border-radius:18px;padding:12px 6px;font-size:12px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center;transition:transform .15s,border-color .2s}
.qa button:active{transform:scale(.96);border-color:var(--gold)}
.qa button span{font-size:22px}
.foot{text-align:center;color:var(--mut);font-size:12px;padding:28px 16px 6px}
.sup{padding:18px}
.sup h2{margin:34px 0 4px;font-size:22px}
.sup .lead{color:var(--mut);font-size:13px;margin:0 0 16px}
.sup .btns{display:grid;gap:10px}
.sup .btns .btn{padding:15px;justify-content:flex-start}
.info{background:rgba(23,20,14,.74);border:1px solid rgba(212,175,55,.16);border-radius:16px;padding:12px 14px;margin-top:12px;font-size:14px}
.info small{display:block;color:var(--mut);font-size:12px}
details{background:rgba(23,20,14,.74);border:1px solid rgba(212,175,55,.16);border-radius:14px;padding:12px 14px;margin-top:8px}
summary{cursor:pointer;font-weight:600;font-size:14px}
details p{margin:8px 0 0;color:#ddd5bf;font-size:13px}

/* v4 */
#aura{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#aura i{position:absolute;width:90vmax;height:90vmax;border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.14),transparent 62%);animation:drift 22s ease-in-out infinite alternate}
#aura i:nth-child(1){top:-45vmax;right:-35vmax}
#aura i:nth-child(2){bottom:-50vmax;left:-45vmax;animation-delay:-9s;background:radial-gradient(circle,rgba(160,110,20,.13),transparent 62%)}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em}
.top b{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:20px}
.sec h3{font-size:18px}
.hero{padding:34px 22px 26px;border-radius:28px;min-height:250px;background:linear-gradient(160deg,rgba(42,33,8,.92),rgba(14,12,8,.94) 62%);border:1px solid rgba(212,175,55,.3)}
.hero::after{content:"";inset:0;left:0;bottom:0;font-size:0;background:var(--wm) 12% 50%/130% auto no-repeat;opacity:1;transform:none}
.hero>*{position:relative;z-index:1}
.hero .eye{color:var(--gold);letter-spacing:.5px;font-size:12px;display:block;margin-bottom:6px}
.hero h2{font-size:34px;line-height:1.25;margin:0 0 10px;font-weight:800;color:var(--txt)}
.hero h2 b{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:14px;max-width:82%;margin-bottom:20px}
.hero .hb{display:flex;gap:10px;flex-wrap:wrap}
.hero .hl{position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,235,160,.13),transparent);animation:sweep 5.5s ease-in-out infinite;transform:skewX(-18deg);z-index:0}
@keyframes sweep{0%{left:-60%}60%,100%{left:130%}}
.fcs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 8px;scrollbar-width:none}
.fcs::-webkit-scrollbar{display:none}
.fc{flex:none;width:74%;max-width:300px;aspect-ratio:4/5;border-radius:26px;background:#000 center/cover no-repeat;position:relative;overflow:hidden;scroll-snap-align:center;cursor:pointer;border:1px solid rgba(212,175,55,.24);box-shadow:0 14px 34px rgba(0,0,0,.5)}
.fc .fo{position:absolute;inset:auto 0 0 0;padding:48px 14px 14px;background:linear-gradient(transparent,rgba(0,0,0,.9))}
.fc .fo span{font-size:11px;color:var(--gold2);background:rgba(0,0,0,.45);border:1px solid rgba(212,175,55,.3);border-radius:10px;padding:0 8px}
.fc .fo h4{margin:6px 0 0;font-size:16px}
.pc.wide{grid-column:1/-1}
.pc.wide .im{aspect-ratio:16/9}
@media(min-width:720px){.pc.wide{grid-column:span 2}}
nav .mid{position:relative;color:#fff}
nav .mid .ic{width:30px;height:30px}
nav .mid::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(37,211,102,.55);animation:ring 2.2s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.5);opacity:0}}
.bd .price{display:inline-block;background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.35);border-radius:14px;padding:2px 16px;margin-top:6px}
/* splash */
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 40%,#1d1708,#0b0a08 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .3s,visibility .3s;cursor:pointer}
#splash.off{opacity:0;visibility:hidden}
#splash .lg{width:230px;height:230px;border-radius:44px;box-shadow:none;animation:fadein .4s both}
#spHint{margin:0;color:var(--gold2);font-size:14px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* cart */
.cb{position:absolute;left:16px;top:calc(10px + env(safe-area-inset-top));width:40px;height:40px;border-radius:12px;border:1px solid rgba(212,175,55,.3);background:var(--card);font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.cb b{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;border-radius:10px;background:var(--g);color:#1a1405;font-size:11px;display:none;align-items:center;justify-content:center;padding:0 5px;font-weight:800}
.cb b.on{display:flex}
.ci{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ci .t{width:62px;height:62px;border-radius:12px;background:#000 center/cover;flex:none}
.ci .m{flex:1;min-width:0;font-size:14px}
.ci .m b{display:block;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ci .m small{color:var(--mut);font-size:12px}
.qt{display:flex;align-items:center;gap:8px}
.qt button{width:30px;height:30px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:16px;padding:0}
.qt span{min-width:20px;text-align:center;font-size:14px}
.qt .rm{border-color:#431616;color:#ffb4b4;font-size:14px}
.sm{background:rgba(23,20,14,.74);border:1px solid rgba(212,175,55,.16);border-radius:16px;padding:8px 14px;margin-top:14px}
.sm div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px}
.sm div span:first-child{color:var(--mut)}
.sm .tt{border-top:1px solid var(--line);margin-top:4px;padding-top:10px;font-weight:700;color:var(--gold2);font-size:16px}
.sm .tt span:first-child{color:var(--gold2)}
.card.ship{font-size:13px;padding:12px 14px;color:#ddd5bf}
.cardbox{background:var(--g);color:#1a1405;border-radius:18px;padding:14px 16px;margin:10px 0;text-align:center}
.cardbox .no{font-size:22px;letter-spacing:2px;direction:ltr;font-weight:800;margin:6px 0}
.cardbox .nm{font-weight:700}
.cardbox small{display:block;opacity:.8}
.cardbox .btn{margin-top:10px;background:#1a1405;color:var(--gold2)}
.note{font-size:12px;color:var(--mut);margin-top:6px}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:13px;color:var(--txt);cursor:pointer}
.chk input{margin-top:5px;accent-color:#d4af37;width:18px;height:18px;flex:none}
select.inp option{background:#17140e}
#cart .sup{padding-bottom:40px}

.oc{background:rgba(23,20,14,.74);border:1px solid rgba(212,175,55,.16);border-radius:16px;padding:12px 14px;margin-top:12px;font-size:13px}
.oc a{color:var(--gold2)}
.oc select.inp{padding:8px 10px}
.stk{font-size:11px;margin-top:4px;color:#9ad7a8}.stk.low{color:#e6c35c}.stk.no{color:#ffb4b4}

/* promo / sale */
.price{display:flex;flex-wrap:wrap;align-items:center;gap:0 8px}
.price .old{color:var(--mut);font-weight:400;font-size:.78em;text-decoration:line-through;text-decoration-color:#e5484d}
.price .off{background:#e5484d;color:#fff;border-radius:8px;padding:0 6px;font-size:.7em;font-weight:700}
.rb{position:absolute;top:8px;right:8px;background:linear-gradient(135deg,#e5484d,#b3262b);color:#fff;border-radius:10px;padding:2px 9px;font-size:11px;font-weight:700;z-index:2;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.rb.bf{background:#000;color:var(--gold2);border:1px solid var(--gold)}
.bdg{display:inline-block;background:#e5484d;color:#fff;border-radius:10px;padding:2px 10px;font-size:12px;font-weight:700;margin:2px 0}
.promo{margin:14px 16px 0;border-radius:22px;padding:16px;border:1px solid #5a1d1d;background:linear-gradient(135deg,#000,#2b0a0a 70%)}
.promo.sale{background:linear-gradient(135deg,#3a2a05,#120d03);border-color:#6a5314}
.promo.fest{background:linear-gradient(135deg,#1d0b3a,#0d0818);border-color:#4a2a8a}
.promo.off{background:linear-gradient(135deg,#0b2a22,#07120f);border-color:#1f6a55}
.promo h3{margin:0 0 4px;font-size:20px;color:var(--gold2)}
.promo p{margin:0 0 10px;color:#d8cfb8;font-size:13px}
.pcd{display:inline-block;direction:ltr;background:rgba(0,0,0,.5);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-weight:700;color:var(--gold2);margin-bottom:10px}
.promo .hb{display:flex;gap:8px;flex-wrap:wrap}
.cp{display:flex;gap:8px;margin-top:12px}.cp .inp{flex:1;margin:0}
.qa.q4{grid-template-columns:repeat(4,1fr)}
.whw{position:relative;width:min(300px,80vw);margin:14px auto 0}
.wcv{width:100%;height:auto;border-radius:50%;border:4px solid var(--gold);box-shadow:0 0 30px rgba(212,175,55,.25);display:block}
.wpt{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:30px;color:#e5484d;z-index:2;text-shadow:0 2px 4px #000;line-height:1}
</style>
</head>
<body>

<div id="wm"></div>
<div id="aura"><i></i><i></i></div>

 try{const t=db.transaction(st,mode);const r=fn(t.objectStore(st));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('abort'))}catch(e){rej(e)}});

/* ---------- آماده‌سازی عکس/ویدیو برای ذخیره‌ی مطمئن ---------- */
async function prepMedia(f){
 if(f.type.startsWith('video'))return{type:'video',blob:new Blob([await f.arrayBuffer()],{type:f.type||'video/mp4'})};
 try{
  const bmp=await createImageBitmap(f),k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  const x=c.getContext('2d'),png=f.type==='image/png';if(!png){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}
  x.drawImage(bmp,0,0,c.width,c.height);
  const b=await new Promise(r=>c.toBlob(r,png?'image/png':'image/jpeg',.88));
  if(b&&b.size)return{type:'image',blob:b};
 }catch(e){}
 return{type:'image',blob:new Blob([await f.arrayBuffer()],{type:f.type||'image/jpeg'})};
}

/* ---------- پشتیبان ---------- */
const b2d=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function exportAll(){toast('در حال آماده‌سازی…');
 const out={settings:S,orders:getOrders(),products:await Promise.all(products.map(async p=>({...p,media:await Promise.all(p.media.map(async m=>({type:m.type,data:await b2d(m.blob)})))})))};
 const a=document.createElement('a');a.href=url(new Blob([JSON.stringify(out)],{type:'application/json'}));a.download='shahr-farangam-backup.json';a.click()}
async function importAll(f){if(!f)return;const d=JSON.parse(await f.text());S={...S,...d.settings,localEdit:Date.now()};await saveS();
 if(d.orders){const os=getOrders();d.orders.forEach(o=>{if(!os.some(x=>x.code===o.code))os.push(o)});os.sort((a,b)=>b.t-a.t);saveOrders(os)}
 for(const p of d.products){p.media=await Promise.all(p.media.map(async m=>({type:m.type,blob:await (await fetch(m.data)).blob()})));await tx('products','readwrite',s=>s.put(p))}
 await load();applyLogo();bindConsult();render();renderAdmin();toast('بازیابی شد ✓')}

async function exportCatalog(){toast('در حال آماده‌سازی…');
 const {pin,catalogVer,localEdit,...st}=S;
 const out={ver:Date.now(),settings:st,products:await Promise.all(products.map(async p=>({...p,media:await Promise.all(p.media.map(async m=>({type:m.type,data:await b2d(m.blob)})))})))};
 const a=document.createElement('a');a.href=url(new Blob([JSON.stringify(out)],{type:'application/json'}));a.download='catalog.json';a.click()}
async function syncCatalog(){
 try{const r=await fetch('catalog.json',{cache:'no-store'});if(!r.ok)return;const d=await r.json();
  if(!d.ver||d.ver===S.catalogVer)return;
  if(S.localEdit)return;
  const pin=S.pin;
  const np=[];for(const p of d.products){p.media=await Promise.all(p.media.map(async m=>({type:m.type,blob:await (await fetch(m.data)).blob()})));np.push(p)}
  for(const p of products)await tx('products','readwrite',s=>s.delete(p.id));
  for(const p of np)await tx('products','readwrite',s=>s.put(p));
  S={...S,...d.settings,pin,catalogVer:d.ver};await saveS();await load();
 }catch(e){}
}
