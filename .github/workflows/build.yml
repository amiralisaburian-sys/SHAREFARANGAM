name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-*.png www/
      - run: npm install
      - run: npx cap add android
      - name: Set app icon
        run: |
          R=android/app/src/main/res
          IM=$(command -v magick || command -v convert)
          for d in "mdpi 48 108" "hdpi 72 162" "xhdpi 96 216" "xxhdpi 144 324" "xxxhdpi 192 432"; do
            set -- $d
            $IM icon-512.png -resize ${2}x${2} $R/mipmap-$1/ic_launcher.png
            $IM icon-512.png -resize ${2}x${2} $R/mipmap-$1/ic_launcher_round.png
            INNER=$(( $3 * 75 / 100 ))
            $IM icon-512-maskable.png -resize ${INNER}x${INNER} -background '#0B0A08' -gravity center -extent ${3}x${3} $R/mipmap-$1/ic_launcher_foreground.png
          done
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n<color name="ic_launcher_background">#0B0A08</color>\n</resources>\n' > $R/values/ic_launcher_background.xml
      - name: Set version
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
      - run: npx cap sync android
      - name: Build signed APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KS_B64" ] && [ -n "$KS_PW" ]; then
            echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.keystore" \
              -Pandroid.injected.signing.store.password="$KS_PW" \
              -Pandroid.injected.signing.key.alias=shahrefarangam \
              -Pandroid.injected.signing.key.password="$KS_PW"
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/ShahreFarangam.apk"
          else
            echo "No signing secrets found, building debug APK"
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ShahreFarangam.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ShahreFarangam-APK
          path: ShahreFarangam.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: شهر فرنگم v${{ github.run_number }}
          files: ShahreFarangam.apk
